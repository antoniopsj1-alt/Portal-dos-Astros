<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="Astros, Antônio Pereira de Souza Junior, horóscopo, signo, idade">
    <meta name="author" content="Antônio Pereira de Souza Junior">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://js.puter.com/v2/"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Portal dos Astros</title>
</head>

<body>

    <div class="container">
        <h1>Portal dos Astros</h1>
        <p class="subtitle">Descubra a sua idade, o seu signo e o seu horóscopo.</p>

        <form id="astrosForm">
            <div class="form-group">
                <label for="nome">Seu Nome</label>
                <input type="text" id="nome" required placeholder="Ex: Antônio Pereira de Souza Junior">
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" id="dataNascimento" required>
            </div>

            <button type="submit">Revelação</button>
        </form>

        <div id="resultado" class="result">
            <div class="resultado-linha">

                <div class="resultado-texto">
                    <h3>Resultado para <span id="resNome"></span>:</h3>
                    <p>Idade Atual: <strong id="resIdade"></strong></p>
                    <p>Signo do Zodíaco: <strong id="resSigno"></strong></p>
                </div>

                <div id="boxImagemSigno" class="resultado-imagem" style="display:none;">
                    <img id="imgSigno" alt="Signo do zodíaco">
                </div>

                <div class="horoscopo-box">
                    <h4>Horóscopo do dia</h4>
                    <p id="horoscopoTexto">Carregando...</p>
                </div>
            </div>
        </div>
                 <p style="text-align: center;">
                  <a href="https://antoniopsj1-alt.github.io/Portfolio-AntonioJunior/" target="_blank" style="text-decoration: none; color: inherit;">
                   &copy; 2026 Antônio Pereira de Souza Junior.
                  </a>
                  </p>
			<p style="text-align: center;">Todos os direitos reservados.</p>
			<address style="text-align: center; color: blue; text-weight: bold;">
			 Contato: <a href="mailto:antoniopsj1@gmail.com">antoniopsj1@gmail.com</a>
			</address>
        <button id="btnVoltar" onclick="limparTexto()" type="submit" style="display:none;">Voltar</button>
    </div>
        <script src="scripts.js"></script>
    </body>
</html>
